<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://xpeunnqqtwdtvwvxybor.supabase.co https://world.openfoodfacts.org; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>FitTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<aside>
  <div class="brand">FitTrack</div>
  <nav>
    <button data-act="nav" data-v="dash"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Overview</button>
    <button data-act="nav" data-v="food"><svg viewBox="0 0 24 24"><path d="M6 3v8a3 3 0 0 0 3 3v7M9 3v8M12 3v8a3 3 0 0 1-3 3M18 3c-2 2-3 5-3 8h3v10"/></svg>Nutrition</button>
    <button data-act="nav" data-v="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Training</button>
    <button data-act="nav" data-v="prog"><svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg>Progress</button>
    <button data-act="nav" data-v="set"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings</button>
  </nav>
</aside>
<div class="wrap">
  <header>
    <div class="db">
      <button class="ghost" data-act="d" data-n="-1" aria-label="Previous day">‹</button>
      <b id="date"></b>
      <button class="ghost" data-act="d" data-n="1" aria-label="Next day">›</button>
    </div>
    <div class="hr"><span id="sync" class="sync" hidden></span><button class="ghost" data-act="today">Today</button></div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" role="status"></div>
<script src="supabase.js?v=10"></script>
<script src="script.js?v=10"></script>
</body>
</html>
