<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>FitTrack</h1>
  <div class="datebar">
    <button id="prev" aria-label="Previous day">‹</button>
    <input type="date" id="date">
    <button id="next" aria-label="Next day">›</button>
  </div>
</header>

<nav>
  <button class="tab active" data-tab="today">Food &amp; water</button>
  <button class="tab" data-tab="gym">Gym programme</button>
</nav>

<main>
  <section id="today">
    <div class="panel">
      <div class="big"><span id="kcalTotal">0</span><small>/ <input id="kcalGoal" type="number" min="0"> kcal</small></div>
      <div class="bar"><i id="kcalBar" class="kcal"></i></div>
      <form id="mealForm">
        <input id="mealName" placeholder="Food (e.g. Chicken and rice)" required>
        <input id="mealKcal" type="number" min="0" placeholder="kcal" required>
        <button>Add food</button>
      </form>
      <ul id="mealList"></ul>
    </div>

    <div class="panel">
      <div class="big"><span id="waterTotal">0</span><small>/ <input id="waterGoal" type="number" min="0"> ml</small></div>
      <div class="bar"><i id="waterBar" class="water"></i></div>
      <div class="quick">
        <button data-ml="250">+250 ml</button>
        <button data-ml="500">+500 ml</button>
        <button data-ml="750">+750 ml</button>
        <button id="waterUndo" class="ghost">Undo last</button>
      </div>
    </div>
  </section>

  <section id="gym" hidden>
    <div class="days" id="dayPicker"></div>
    <div class="panel">
      <h2 id="dayTitle"></h2>
      <ul id="exList"></ul>
      <form id="exForm">
        <input id="exName" placeholder="Exercise (e.g. Bench press)" required>
        <input id="exSets" type="number" min="1" placeholder="Sets" required>
        <input id="exReps" type="number" min="1" placeholder="Reps" required>
        <input id="exKg" type="number" min="0" step="0.5" placeholder="kg">
        <button>Add exercise</button>
      </form>
    </div>
    <p class="note">The programme repeats every week. Ticks are saved for the date selected above.</p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
